<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGMC — Serveur injoignable</title>
    <link rel="stylesheet" href="offline.css">
</head>
<body>
    <main class="card">
        <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="30" fill="#F3E7C9"/>
            <path d="M14 38 Q32 22 50 38" fill="none" stroke="#0B3D91" stroke-width="4" stroke-linecap="round"/>
            <path d="M22 46 Q32 37 42 46" fill="none" stroke="#0B3D91" stroke-width="4" stroke-linecap="round"/>
            <circle cx="32" cy="52" r="3.5" fill="#D4AF37"/>
            <line x1="12" y1="12" x2="52" y2="52" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
        </svg>

        <h1>Serveur injoignable</h1>
        <p class="reason" id="reason"></p>
        <p class="target">Adresse utilisée&nbsp;: <code id="target-url"></code></p>
        <p class="hint">
            Vérifiez votre connexion réseau, puis assurez-vous que le poste
            serveur est allumé et que le service SGMC y est démarré.
        </p>

        <button class="btn btn-primary" id="retry-btn">Réessayer</button>
        <button class="btn btn-secondary" id="config-btn">Configurer le serveur…</button>
    </main>

    <script src="offline.js"></script>
</body>
</html>
